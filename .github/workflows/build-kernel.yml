name: Build ShiomiKernuk 5.10.272 (SukiSU, Enforcing+Permissive)
on:
  workflow_dispatch:
  push:
    branches: [mahiru-main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SukiSU-Ultra into drivers/kernelsu
        run: rm -rf drivers/kernelsu && curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm bc bison flex libssl-dev libelf-dev cpio
      - name: Config + tweaks
        run: |
          make O=out ARCH=arm64 gki_defconfig
          ./scripts/config --file out/.config --set-str LOCALVERSION "-ShiomiKernuk-SukiSU-270-v1.1"
          ./scripts/config --file out/.config \
            -d KASAN -d KASAN_GENERIC -d KASAN_SW_TAGS -d KASAN_OUTLINE -d UBSAN -d KCOV -d GCOV_KERNEL -d WERROR \
            -e TCP_CONG_BBR -e NET_SCH_FQ -e WIREGUARD \
            \
            -e SCHED_AUTOGROUP -e HZ_1000 \
            --set-val VM_MAX_READAHEAD 2048
          make O=out ARCH=arm64 olddefconfig
      - name: Build
        run: PATH=/usr/lib/llvm-14/bin:$PATH make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image.gz
      - name: AnyKernel zips (enforcing + permissive)
        run: |
          git clone --depth=1 -b gki https://github.com/whiskiesweet/Azure-Anykernel anykernel
          cp out/arch/arm64/boot/Image.gz anykernel/Image.gz
          cd anykernel
          zip -r9 ../ShiomiKernuk-270-Enforcing.zip . -x .git/\*
          # permissive variant: add selinux cmdline patch
          grep -q "patch_cmdline" anykernel.sh || sed -i 's|^split_boot$|patch_cmdline "androidboot.selinux" "androidboot.selinux=permissive"\nsplit_boot|' anykernel.sh
          zip -r9 ../ShiomiKernuk-270-Permissive.zip . -x .git/\*
      - uses: actions/upload-artifact@v4
        with:
          name: shiomikernuk-270
          path: |
            out/arch/arm64/boot/Image.gz
            ShiomiKernuk-270-Enforcing.zip
            ShiomiKernuk-270-Permissive.zip
